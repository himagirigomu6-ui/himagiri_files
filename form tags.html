<html>
    <head>
        <title>HTML FORTAGS</title>
    </head>
    <body>
        <form>
            <label for="name">full name:</label>
            <input type="text" id="name"placeholder="ENTER CAPITAL LETTER"><br>
            <br>
            <label for="age">age:</label>
            <input type="number" id="age"><br>
            <br>
            <label for="email">email:</label>
            <input type="email" id="email"><br>
            <br>
            <label for="dod">date birth:</label>
            <input type="date" id="dod"><br>
            <br>
            <label for="male">male:</label>
            <input type="radio" id="male" name="gender"value>
            <label for="female">female:</label>
            <input type="radio" id="female" name="gender"value><br>
            <br>
            <label for="country">education</label>
            <select id="education">
                <option value="ssc">ssc</option>
                <option value="inter">inter</option>
                <option value="degree">degree</option>
                <option value="pg">pg</option>
            </select><br><br>
            <label for="mobile">mobile number:</label>
            <label type="tel" id="mobile" maxlength="10"relocated></label><br>
            <br>
            <label for="name">project:</label>
            <input type="text" id="name"value="Aarohan">
            <label for="map">upload resume:</label>
            <input type="file" id="map"><br>
            <br>
            <label for="text">uname:</label>
            <input type="text" id="text" name="username"relocated><br>
            <br>
            <label for="password">password:</label>
            <input type="password" name="password" required>
            <button type="submit" >submit:</button>
            <button type="reset">reset:</button>
        </form>
    </body>
</html>
