<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Request App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 90%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #e30909;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #3208ef;
        }

        #input_text {
            width: 100%;
            padding: 15px;
            border: 2px solid #190ac1;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
        }

        #input_text:focus {
            border-color: #f77920;
            padding: 2px solid rgb(62, 2, 201);
        }
          button {
            
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #667eea, #e092dc);
            color: rgb(15, 241, 4);
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        
          }
        button:hover {
            background-color: #efe6ed;
            color: #3e0ce4;
        }

        #output {
            margin-top: 20px;
            padding: 100px;
            background: #d090ba;
            border-radius: 10px;
            min-height: 10px;
            color: #3e0ce4;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>API Request App</h1>
        <label for="input_text">Enter Your Text</label>
        <input
            type="text"
            id="input_text"
            placeholder="Enter something..."
        >

       <button onclick="sendReques(document.getE1ementById('input_text').value)">
        submit
       </button>

        <div id="output">
            Result will appear here...
        </div>

    </div>

    <script>

        async function sendRequest(usr_input) {

            if (usr_input.trim() === "") {
                document.getElementById("output").innerText =
                    "Please enter some text.";
                return;
            }

            try {

                const response = await fetch(
                    "https://3h0jj9j1-5000.inc1.devtunnels.ms/ask_my_llm",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },
                     
                        body: JSON.stringify({
                            input: usr_input
                        })
                    }
                );

                const result = await response.json();

                console.log(result);

                document.getElementById("output").innerText =
                    JSON.stringify(result.response, null, 2);

            } catch (user) {

                console.error(user);

                document.getElementById("output").innerText =
                    "Error: " + error.message;
            }
        }

    </script>

</body>
</html>
