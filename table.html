
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Data Table</title>

    <style>
        

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
          
            background: rgb(229, 202, 202);
            padding: 40px;

            border-radius:rgb(139, 222, 221) 18px;

            box-shadow: 0 10px 30px rgba(3, 223, 25, 0.25);
        }

        h1 {
            text-align: center;
            color: #e80b0b;
            margin-bottom: 30px;
        }

        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        #input_text {
            flex: 1;

            padding: 14px;

            border: 2px solid #667eea;
            border-radius: 8px;

            font-size: 16px;
        }

        button {
            padding: 14px 28px;

            border: none;
            border-radius: 8px;

            background: #667eea;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ae0589;
        }

        #status {
            text-align: center;
            color: green;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .table-container {
            overflow-x: auto;
            border:10px solid #1d1925;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color:#1409f3
        }

        th {
            background: #bab1ba;
            color: rgb(8, 8, 8);
            padding: 15px;
        }

        td {
            padding: 14px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #7babbc;
        }

        tr:hover {
            background: #ccadcc;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            background: #d090ba;
            border-radius: 10px;
            min-height: 10px;
            color: #3e0ce4;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>API Data Table</h1>

        <div class="input-area">

            <input
                type="text"
                id="input_text"
                placeholder="Enter your input"
            >
  <br><br>
           <button onclick="sendReques(document.getE1ementById('input_text').value)">
        submit
       </button>
  <br><br>
        </div>
    <div id="output">
            Result will appear here...
        </div>

        <p id="status"></p>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>City</th>
                        <th>course</th>
                    </tr>
                    <tr>
                        <td>hima</td>
                        <td>23</td>
                        <td>addateegala</td>
                        <td>AI</td>
                    </tr>
                    <tr>
                        <td>sai</td>
                        <td>23</td>
                        <td>bakuluru</td>
                        <td>AI</td>

                    </tr>
                    <tr>
                        <td>bindu</td>
                        <td>23</td>
                        <td>paderu</td>
                        <td>AI</td>
                    </tr>
               
            </table>

        </div>

    </div>


    <script>

        async function sendRequest() {

            // Input box value
            const usr_input =
                document.getElementById("input_text").value;

            const status =
                document.getElementById("status");

            if (usr_input.trim() === "") {

                status.innerText =
                    "Please enter your input.";

                return;
            }

            status.innerText = "Loading...";

            try {

                // API request
                const response = await fetch(
                     "https://3h0jj9j1-5000.inc1.devtunnels.ms/ask_my_llm",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"

                        },

                        body: JSON.stringify({
                            input: usr_input
                        })
                    }
                );
            }
                // JSON response
                
                 const result = await response. json()
                console.log("API Response:", result);

                // Table clear
                const tableBody =
                    document.getElementById("tableBody");

                tableBody.innerHTML = "";

                

                }
    </script>

</body>
</html>
